spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always

import:
  excel:
    column-mapping:
      date: Date
      username: Username
      hours: Hours
      task: Task
      absence: Absence
